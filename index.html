<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spider-Man: Brand New Day – ด่านความน่าจะเป็น</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--red:#e62429;--blue:#2b2b33;--ink:#fff;--card:rgba(20,6,10,.82);--ok:#22c55e;--bad:#ef4444;--gold:#fbbf24}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Prompt','Noto Sans Thai',Tahoma,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 0%,#7a0c12 0,#2a0508 45%,#0a0203 100%);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:
repeating-conic-gradient(from 0deg at 50% 0%,transparent 0 9deg,rgba(255,255,255,.07) 9deg 9.4deg),
repeating-radial-gradient(circle at 50% 0%,transparent 0 60px,rgba(255,255,255,.06) 60px 62px);pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px}
h1{font-weight:800;font-size:clamp(1.5rem,5vw,2.2rem);margin:.2em 0;text-align:center;text-shadow:0 3px 0 var(--red),0 6px 14px #000}
.card{background:var(--card);border:2px solid rgba(255,255,255,.18);border-radius:20px;padding:18px;backdrop-filter:blur(6px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.hide{display:none!important}
/* 3D Spiderman */
.stage{perspective:700px;height:170px;display:flex;justify-content:center;align-items:center}
.head{position:relative;width:130px;height:150px;transform-style:preserve-3d;animation:sway 4s ease-in-out infinite}
.head .l{position:absolute;inset:0;border-radius:50% 50% 46% 46%/46% 46% 54% 54%;background:radial-gradient(circle at 35% 25%,#ff6b6e,var(--red) 55%,#8e0f14)}
.head .l:nth-child(1){transform:translateZ(-30px) scale(.88);filter:brightness(.6)}
.head .l:nth-child(2){transform:translateZ(-18px) scale(.94);filter:brightness(.75)}
.head .l:nth-child(3){transform:translateZ(-6px) scale(.98);filter:brightness(.9)}
.head .l:nth-child(4){transform:translateZ(6px)}
.head .f{position:absolute;inset:0;transform:translateZ(14px)}
.head svg{width:100%;height:100%;overflow:visible}
.shadow{position:absolute;bottom:-14px;left:15%;width:70%;height:14px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(5px);animation:sh 4s ease-in-out infinite}
.head.cheer{animation:cheer .8s ease 1}
.head.oops{animation:oops .6s ease 1}
@keyframes sway{0%,100%{transform:rotateY(-28deg) rotateX(6deg) translateY(0)}50%{transform:rotateY(28deg) rotateX(-4deg) translateY(-10px)}}
@keyframes sh{0%,100%{transform:scale(1)}50%{transform:scale(.8);opacity:.6}}
@keyframes cheer{0%{transform:rotateY(0)}100%{transform:rotateY(720deg) translateY(-6px)}}
@keyframes oops{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:20vh;background:linear-gradient(#000,#1a0306);clip-path:polygon(0 100%,0 60%,5% 60%,5% 30%,9% 30%,9% 55%,14% 55%,14% 15%,18% 15%,18% 50%,24% 50%,24% 35%,29% 35%,29% 65%,35% 65%,35% 20%,40% 20%,40% 55%,46% 55%,46% 40%,52% 40%,52% 10%,57% 10%,57% 60%,63% 60%,63% 30%,68% 30%,68% 50%,74% 50%,74% 25%,79% 25%,79% 60%,85% 60%,85% 35%,91% 35%,91% 55%,96% 55%,96% 45%,100% 45%,100% 100%);pointer-events:none;z-index:0}
.clock{position:relative;width:64px;height:64px;margin:8px auto 0}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.clock circle{fill:rgba(0,0,0,.5);stroke:#fff3;stroke-width:4}
.clock #ring{fill:none;stroke:var(--gold);stroke-linecap:round;stroke-dasharray:119.4;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear}
.clock b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.3rem}
.clock.warn #ring{stroke:var(--bad)}.clock.warn{animation:tick 1s infinite}
@keyframes tick{50%{transform:scale(1.12)}}
/* UI */
input{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:2px solid #fff3;background:#0008;color:#fff;margin:10px 0}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:14px;padding:13px 20px;color:#fff;background:linear-gradient(180deg,#ff4a4f,var(--red));box-shadow:0 5px 0 #8e0f14;transition:transform .1s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #8e0f14}
button.alt{background:linear-gradient(180deg,#4a4a55,var(--blue));box-shadow:0 5px 0 #111}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.bar{height:12px;border-radius:9px;background:#fff2;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .4s}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.tag{padding:3px 12px;border-radius:99px;font-size:.85rem}
.easy{background:#16a34a}.mid{background:#d97706}.hard{background:#dc2626}
.q{font-size:clamp(1.15rem,4vw,1.5rem);font-weight:600;margin:14px 0;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#ffffff14;border:2px solid #fff4;box-shadow:none;font-size:1.3rem;padding:16px}
.opt.right{background:var(--ok);border-color:#fff}
.opt.wrong{background:var(--bad);border-color:#fff}
.fb{margin-top:14px;padding:14px;border-radius:14px;background:#0009;border-left:6px solid var(--gold);line-height:1.6}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.big{font-size:3rem;font-weight:800;text-align:center;color:var(--gold)}
.wrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.9rem}
th,td{padding:7px 6px;border-bottom:1px solid #fff3;text-align:center}
td:nth-child(2){text-align:left;white-space:nowrap}
th{background:#0008;position:sticky;top:0}
.x0{color:var(--bad)}.x1{color:var(--ok)}
.star{color:var(--gold)}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>🕷️ SPIDER-MAN: BRAND NEW DAY<br><small style="font-size:.6em">ภารกิจด่านความน่าจะเป็น</small></h1>
  <div class="stage"><div class="head" id="head">
    <div class="l"></div><div class="l"></div><div class="l"></div><div class="l"></div>
    <div class="f"><svg viewBox="0 0 130 150">
      <g stroke="#0006" stroke-width="1.4" fill="none">
        <path d="M65 0V150M65 75L10 30M65 75L120 30M65 75L0 80M65 75L130 80M65 75L15 125M65 75L115 125"/>
        <circle cx="65" cy="75" r="20"/><circle cx="65" cy="75" r="42"/><circle cx="65" cy="75" r="64"/>
      </g>
      <path d="M12 62Q32 40 56 74Q36 90 14 84Z" fill="#fff" stroke="#000" stroke-width="4"/>
      <path d="M118 62Q98 40 74 74Q94 90 116 84Z" fill="#fff" stroke="#000" stroke-width="4"/>
    </svg></div>
    <div class="shadow"></div>
  </div></div>

  <section id="start" class="card">
    <p style="text-align:center;margin:0">ช่วยสไปเดอร์แมนไขปริศนา 10 ด่าน! ต้องได้อย่างน้อย <b class="star">600 คะแนน</b> จึงจะผ่านภารกิจ</p>
    <input id="name" placeholder="พิมพ์ ชื่อ-นามสกุล" autocomplete="off">
    <div class="row"><button id="go">🚀 เริ่มภารกิจ</button><button class="alt" id="toBoard">🏆 ดูตารางคะแนน</button></div>
  </section>

  <section id="game" class="card hide">
    <div class="top"><span id="who"></span><span id="lvl"></span><span id="diff" class="tag"></span><span id="sc">คะแนน: 0</span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="clock" id="clock"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19"/><circle id="ring" cx="22" cy="22" r="19"/></svg><b id="tm">60</b></div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <div id="fb" class="fb hide"></div>
    <div class="row"><button id="next" class="hide">ไปด่านต่อไป ➜</button></div>
  </section>

  <section id="result" class="card hide"></section>

  <section id="board" class="card hide">
    <h2 style="text-align:center;margin:0">🏆 ตารางคะแนน</h2>
    <div class="wrap" id="tbl"></div>
    <div class="row">
      <button class="alt" id="back">⬅ กลับ</button>
      <button class="alt" id="csv">⬇ ดาวน์โหลด CSV</button>
      <button class="alt" id="fw">🎆 พลุฉลองอันดับ 1</button>
      <button id="clr">🗑 ล้างคะแนน (ครู)</button>
    </div>
  </section>
</main>

<script>
const Q=[
["โยนเหรียญ 1 เหรียญ 1 ครั้ง โอกาสที่จะออกหัวเป็นเท่าไร",["1/2","1/3","1","0"],"easy","เหรียญมี 2 หน้า คือ หัวกับก้อย โอกาสเท่ากัน ออกหัวได้ 1 แบบ จาก 2 แบบ ดังนั้น 1/2"],
["ทอยลูกเต๋า 1 ลูก 1 ครั้ง โอกาสที่จะได้แต้ม 6 เป็นเท่าไร",["1/6","1/3","1/2","6"],"easy","ลูกเต๋ามี 6 หน้า (1-6) ได้แต้ม 6 มี 1 หน้า ดังนั้น 1/6"],
["ในถุงมีลูกบอลแดง 3 ลูก น้ำเงิน 2 ลูก หยิบ 1 ลูก โอกาสได้ลูกสีแดงเป็นเท่าไร",["3/5","2/5","3/2","1/5"],"easy","ลูกบอลทั้งหมด 3+2 = 5 ลูก ลูกสีแดงมี 3 ลูก ความน่าจะเป็น = 3/5"],
["ทอยลูกเต๋า 1 ลูก โอกาสที่จะได้แต้มเป็นเลขคู่เป็นเท่าไร",["1/2","1/3","2/3","1/6"],"mid","เลขคู่ที่เป็นไปได้คือ 2, 4, 6 มี 3 แบบ จากทั้งหมด 6 แบบ = 3/6 = 1/2"],
["โยนเหรียญ 2 เหรียญพร้อมกัน โอกาสที่จะออกหัวทั้งสองเหรียญเป็นเท่าไร",["1/4","1/2","1/3","2/4"],"mid","ผลที่เป็นไปได้ทั้งหมด 4 แบบ คือ หห, หก, กห, กก ออกหัวทั้งคู่มี 1 แบบ = 1/4"],
["สุ่มบัตรเลข 1 ถึง 20 มา 1 ใบ โอกาสได้เลขที่หารด้วย 5 ลงตัวเป็นเท่าไร",["1/5","1/4","1/2","1/10"],"mid","เลขที่หารด้วย 5 ลงตัวคือ 5, 10, 15, 20 มี 4 ตัว จาก 20 ตัว = 4/20 = 1/5"],
["ทอยลูกเต๋า 2 ลูก โอกาสที่แต้มรวมได้ 8 เป็นเท่าไร",["5/36","6/36","4/36","8/36"],"mid","ผลทั้งหมด 6x6 = 36 แบบ แต้มรวม 8 คือ (2,6) (3,5) (4,4) (5,3) (6,2) มี 5 แบบ = 5/36"],
["โยนเหรียญ 3 เหรียญพร้อมกัน โอกาสที่จะออกหัวพอดี 2 เหรียญเป็นเท่าไร",["3/8","1/4","2/8","1/2"],"hard","ผลทั้งหมด 2x2x2 = 8 แบบ ออกหัว 2 เหรียญ คือ หหก, หกห, กหห มี 3 แบบ = 3/8"],
["ทอยลูกเต๋า 2 ลูก โอกาสที่แต้มรวมอย่างน้อย 10 เป็นเท่าไร",["1/6","1/9","5/36","1/4"],"hard","แต้มรวม 10 มี 3 แบบ, 11 มี 2 แบบ, 12 มี 1 แบบ รวม 6 แบบ จาก 36 = 6/36 = 1/6"],
["ถุงมีลูกบอลแดง 4 ลูก น้ำเงิน 6 ลูก หยิบทีละลูก 2 ครั้ง ไม่ใส่คืน โอกาสได้แดงทั้งสองครั้งเป็นเท่าไร",["2/15","4/25","1/5","16/100"],"hard","ครั้งแรกได้แดง = 4/10 ครั้งที่สองเหลือแดง 3 จาก 9 ลูก = 3/9 คูณกัน (4/10)x(3/9) = 12/90 = 2/15"]
];
const DL={easy:"ง่าย",mid:"ปานกลาง",hard:"ยาก"};
const $=id=>document.getElementById(id);
let tid,AC;
const rank=d=>d.filter(r=>r.pass||r.total>=600).sort((a,b)=>b.total-a.total||a.at-b.at);
function upsert(nm,fn){const d=load();let r=d.find(x=>x.name===nm);if(!r){r={name:nm,scores:[],total:0,tries:0,pass:false,done:false,at:Date.now()};d.push(r)}fn(r);if(DB_URL)push(r);else save(d);return d}
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}return AC}
function tone(f,d,type,v,t=0){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),n=a.currentTime+t;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+d)}catch(e){}}
function buzz(){tone(300,.35,"square",.2,0);tone(220,.35,"square",.2,.4);tone(150,.6,"square",.2,.8)}
const cv=document.createElement("canvas");cv.style.cssText="position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none";document.body.appendChild(cv);
const cx=cv.getContext("2d");let P=[],R=[],raf=0;
function fit(){cv.width=innerWidth;cv.height=innerHeight}addEventListener("resize",fit);fit();
function fireworks(){[0,1000,2000].forEach(t=>setTimeout(()=>{R.push({x:innerWidth*(.2+Math.random()*.6),y:innerHeight,ty:innerHeight*(.15+Math.random()*.25),c:Math.floor(Math.random()*360)});tone(500,.4,"sawtooth",.05);run()},t))}
function run(){if(raf)return;(function f(){
  cx.globalCompositeOperation="destination-out";cx.fillStyle="rgba(0,0,0,.2)";cx.fillRect(0,0,cv.width,cv.height);cx.globalCompositeOperation="source-over";
  R=R.filter(r=>{r.y-=9;cx.fillStyle="#fff";cx.fillRect(r.x,r.y,3,10);if(r.y<=r.ty){tone(110,.4,"sawtooth",.2);for(let k=0;k<80;k++){const a=Math.random()*6.283,s=1+Math.random()*5;P.push({x:r.x,y:r.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:r.c+Math.random()*40})}return false}return true});
  P=P.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.l-=.012;if(p.l<=0)return false;cx.fillStyle="hsla("+p.c+",100%,60%,"+p.l+")";cx.beginPath();cx.arc(p.x,p.y,2.5,0,6.283);cx.fill();return true});
  if(R.length||P.length)raf=requestAnimationFrame(f);else{raf=0;cx.clearRect(0,0,cv.width,cv.height)}})()}
function startTimer(){clearInterval(tid);const end=Date.now()+60000,ck=$("clock");let last=60;ck.classList.remove("warn");$("tm").textContent=60;$("ring").style.strokeDashoffset=0;
  tid=setInterval(()=>{const s=Math.max(0,(end-Date.now())/1000),c=Math.ceil(s);$("tm").textContent=c;$("ring").style.strokeDashoffset=119.4*(1-s/60);ck.classList.toggle("warn",s<=10);
    if(c!==last){last=c;if(c<=5&&c>0)tone(880,.08,"square",.1)}
    if(s<=0){clearInterval(tid);buzz();pick(-1,null)}},200)}
const KEY="spider-prob-board-v1";
let name="",i=0,scores=[],order=[],locked=false,tries=1;
const DB_URL=""; /* ← ใส่ URL Firebase เช่น https://xxxx-default-rtdb.firebaseio.com เพื่อให้ทุกเครื่องเห็นตารางเดียวกัน */
let CACHE=[],pend=0;
const load=()=>{if(DB_URL)return CACHE;try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const dkey=n=>encodeURIComponent(n.replace(/[.$#\[\]\/]/g,"_"));
async function pull(){if(pend)return;try{const o=await (await fetch(DB_URL+"/players.json")).json();if(!pend)CACHE=o?Object.values(o).map(r=>({...r,scores:r.scores||[]})):[]}catch(e){}}
function push(r){pend++;fetch(DB_URL+"/players/"+dkey(r.name)+".json",{method:"PUT",body:JSON.stringify(r)}).catch(()=>{}).finally(()=>{pend--})}
if(DB_URL){pull();setInterval(async()=>{await pull();if(!$("board").classList.contains("hide"))render(false)},3000)}
const save=d=>{if(DB_URL)return;try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}};
const show=id=>["start","game","result","board"].forEach(s=>$(s).classList.toggle("hide",s!==id));
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function anim(c){const h=$("head");h.classList.remove("cheer","oops");void h.offsetWidth;h.classList.add(c);setTimeout(()=>h.classList.remove(c),900)}

$("go").onclick=async()=>{name=$("name").value.trim();if(!name){$("name").focus();return}ac();if(DB_URL)await pull();upsert(name,()=>{});tries=1;begin()};
function begin(){i=0;scores=[];show("game");$("who").textContent="🕷️ "+name;level()}
function level(){
  locked=false;const [q,o,d]=Q[i];
  $("lvl").textContent="ด่าน "+(i+1)+"/10";
  $("diff").textContent=DL[d];$("diff").className="tag "+d;
  $("sc").textContent="คะแนน: "+scores.reduce((a,b)=>a+b,0);
  $("prog").style.width=(i/10*100)+"%";
  $("q").textContent=q;
  order=o.map((t,k)=>k).sort(()=>Math.random()-.5);
  $("opts").innerHTML="";
  order.forEach(k=>{const b=document.createElement("button");b.className="opt";b.textContent=o[k];b.onclick=()=>pick(k,b);$("opts").appendChild(b)});
  $("fb").classList.add("hide");$("next").classList.add("hide");
  startTimer();
}
function pick(k,btn){
  if(locked)return;locked=true;clearInterval(tid);
  const ok=k===0,fb=$("fb");
  [...$("opts").children].forEach((b,n)=>{if(order[n]===0)b.classList.add("right")});
  if(!ok&&btn)btn.classList.add("wrong");
  scores.push(ok?100:0);
  $("sc").textContent="คะแนน: "+scores.reduce((a,b)=>a+b,0);
  fb.className="fb "+(ok?"ok":"no");
  fb.innerHTML=(ok?"✅ <b>เก่งมาก! +100 คะแนน</b><br>":(k<0?"⏰ <b>หมดเวลา! 0 คะแนน</b>":"❌ <b>ยังไม่ถูก 0 คะแนน</b>")+" — คำตอบที่ถูกคือ <b>"+Q[i][1][0]+"</b><br>💡 <b>วิธีคิด:</b> ")+Q[i][3];
  anim(ok?"cheer":"oops");
  $("next").textContent=i===9?"ดูผลสรุป 🏁":"ไปด่านต่อไป ➜";
  $("next").classList.remove("hide");
}
$("next").onclick=()=>{if(i<9){i++;level()}else finish()};
function finish(){
  const t=scores.reduce((a,b)=>a+b,0),pass=t>=600,r=$("result");show("result");
  $("prog").style.width="100%";
  upsert(name,r=>{r.tries=tries;r.done=true;if(t>=r.total||!r.scores.length){r.scores=scores;r.total=t}r.pass=r.total>=600});
  if(pass){
    const d=load();
    const first=rank(d)[0]===d.find(x=>x.name===name);
    r.innerHTML=`<div class="big">🎉 ${t} คะแนน</div><p style="text-align:center;font-size:1.2rem">ผ่านภารกิจแล้ว! สไปเดอร์แมนขอบคุณ ${esc(name)} 🕸️ (เล่นครั้งที่ ${tries})${first?"<br>👑 คุณอยู่อันดับ 1! ดูพลุเลย 🎆":""}</p><div class="row"><button class="alt" id="rb">🏆 ดูตารางคะแนน</button><button id="rn">เล่นคนต่อไป</button></div>`;
    $("rb").onclick=board;$("rn").onclick=()=>{$("name").value="";show("start")};anim("cheer");if(first)fireworks();
  }else{
    r.innerHTML=`<div class="big" style="color:#f87171">${t} คะแนน</div><p style="text-align:center;font-size:1.15rem">ยังไม่ถึง 600 คะแนน 😢 อย่าเพิ่งยอมแพ้! ทบทวนวิธีคิดแล้วลองใหม่ทั้ง 10 ด่านนะ</p><div class="row"><button id="rt">🔁 เริ่มใหม่ (ครั้งที่ ${tries+1})</button></div>`;
    $("rt").onclick=()=>{tries++;begin()};anim("oops");
  }
}
function board(){show("board");(DB_URL?pull():Promise.resolve()).then(()=>render(true))}
function render(fx){
  show("board");
  const all=load(),pr=rank(all),d=pr.concat(all.filter(r=>!pr.includes(r)).sort((a,b)=>b.total-a.total));
  const st=["⭐⭐⭐","⭐⭐","⭐"];if(fx&&pr.length)setTimeout(fireworks,300);
  let h='<table><tr><th>#</th><th>ชื่อ-นามสกุล</th>'+Q.map((_,n)=>"<th>"+(n+1)+"</th>").join("")+'<th>รวม</th><th>สถานะ</th></tr>';
  if(!d.length)h+='<tr><td colspan="14">ยังไม่มีผู้เล่น</td></tr>';
  d.forEach((r,n)=>{const p=n<pr.length,top=p&&n<3,sc=r.scores.length?r.scores.map(s=>'<td class="x'+(s?1:0)+'">'+s+"</td>").join(""):'<td>-</td>'.repeat(10);h+="<tr><td>"+(p?n+1:"-")+"</td><td>"+(p&&n==0?"👑 ":"")+esc(r.name)+(top?' <span class="star">'+st[n]+"</span>":"")+"</td>"+sc+"<td><b>"+r.total+"</b></td><td>"+(p?"✅ ผ่าน":(r.done?"🔁 ยังไม่ผ่าน":"🎮 กำลังเล่น"))+"</td></tr>"});
  $("tbl").innerHTML=h+"</table>";
}
$("toBoard").onclick=board;$("back").onclick=()=>show("start");$("fw").onclick=fireworks;
$("clr").onclick=()=>{if(confirm("ล้างคะแนนทั้งหมด?")){if(DB_URL){fetch(DB_URL+"/players.json",{method:"DELETE"}).then(()=>{CACHE=[];render(true)})}else{save([]);render(true)}}};
$("csv").onclick=()=>{
  const all=load(),pr=rank(all),d=pr.concat(all.filter(r=>!pr.includes(r)));
  const rows=[["อันดับ","ชื่อ-นามสกุล",...Q.map((_,n)=>"ด่าน"+(n+1)),"รวม","สถานะ"],...d.map((r,n)=>[n<pr.length?n+1:"-",'"'+r.name.replace(/"/g,'""')+'"',...(r.scores.length?r.scores:Array(10).fill("")),r.total,n<pr.length?"ผ่าน":"ยังไม่ผ่าน"])];
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}));a.download="scores.csv";a.click();
};
</script>
</body>
